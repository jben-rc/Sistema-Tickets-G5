<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Soporte TI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{{ url_for('index') }}">Soporte TI</a>
            <div class="navbar-nav me-auto">
                <a class="nav-link" href="{{ url_for('crear_ticket') }}">Nuevo ticket</a>
                <a class="nav-link" href="{{ url_for('tickets') }}">Tickets</a>
            </div>
            <div class="navbar-nav">
                <a class="nav-link" href="{{ url_for('login') }}">Iniciar sesión</a>
                <a class="nav-link" href="{{ url_for('registro') }}">Registrarse</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
