{% extends 'base.html' %}
{% block titulo %}Iniciar sesión - Soporte TI{% endblock %}
{% block contenido %}
<div class="card shadow-sm mx-auto" style="max-width: 400px;">
    <div class="card-body p-4">
        <h4 class="card-title text-center mb-4">Iniciar sesión</h4>
        <form id="loginForm" novalidate>
            <div class="mb-3 form-field">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="text" class="form-control" id="email" name="email">
                <small></small>
            </div>
            <div class="mb-3 form-field">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" name="password">
                <small></small>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
            <div id="mensajeLogin" class="mt-3"></div>
        </form>
        <p class="text-center mt-3 mb-0">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
    </div>
</div>
{% endblock %}
