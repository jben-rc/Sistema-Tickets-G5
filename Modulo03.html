<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo 3 - Asignación, estados e historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
</head>
<body class="bg-light">
    <div id="menu"></div>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-4">Asignar y cambiar estado</h5>

                        <form id="gestionForm" novalidate>
                            <div class="mb-3 campo">
                                <label for="ticket" class="form-label">Ticket</label>
                                <select class="form-select" id="ticket"></select>
                                <small class="text-danger"></small>
                            </div>
                            <div class="mb-3">
                                <label for="tecnico" class="form-label">Técnico asignado</label>
                                <select class="form-select" id="tecnico"></select>
                            </div>
                            <div class="mb-3">
                                <label for="estado" class="form-label">Estado</label>
                                <select class="form-select" id="estado"></select>
                            </div>
                            <div class="mb-3 campo">
                                <label for="comentario" class="form-label">Comentario (obligatorio)</label>
                                <textarea class="form-control" id="comentario" rows="3"></textarea>
                                <small class="text-danger"></small>
                            </div>
                            <div id="mensajeGestion" class="alert" style="display:none;" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100">Guardar cambio</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-1">Línea de tiempo</h5>
                        <p class="text-muted small" id="resumenTicket">Selecciona un ticket.</p>
                        <ul class="timeline" id="timeline"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/modulo03.js"></script>
</body>
</html>
