<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Soporte TI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
</head>
<body class="bg-light">
    <div id="menu"></div>

    <div class="container">
        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form class="row g-3 align-items-end" id="filtrosForm">
                    <div class="col-sm-4">
                        <label for="desde" class="form-label">Desde</label>
                        <input type="date" class="form-control" id="desde">
                    </div>
                    <div class="col-sm-4">
                        <label for="hasta" class="form-label">Hasta</label>
                        <input type="date" class="form-control" id="hasta">
                    </div>
                    <div class="col-sm-4">
                        <button type="submit" class="btn btn-primary">Filtrar</button>
                        <button type="button" class="btn btn-outline-secondary" id="btnQuitar">Quitar filtros</button>
                    </div>
                </form>
                <p class="text-muted small mt-3 mb-0">Total de tickets en el rango: <strong id="totalTickets">0</strong>.
                    La exportación a Excel/PDF y la API REST se harán con Flask (openpyxl y ReportLab).</p>
            </div>
        </div>

        <div class="row g-4">
            <div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h6>Tickets por estado</h6><canvas id="grafEstado"></canvas></div></div></div>
            <div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h6>Tickets por prioridad</h6><canvas id="grafPrioridad"></canvas></div></div></div>
            <div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h6>Tickets por responsable</h6><canvas id="grafResponsable"></canvas></div></div></div>
            <div class="col-md-6"><div class="card shadow-sm"><div class="card-body"><h6>Tickets por tipo (categoría)</h6><canvas id="grafCategoria"></canvas></div></div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
