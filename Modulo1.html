<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo 1 - Autenticación y usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/comun.css">
</head>
<body class="bg-light">
    <div id="menu"></div>

    <div class="container">
        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-4">Registrar usuario</h5>
                        <p class="text-muted small">Solo el administrador registra usuarios.</p>

                        <form id="usuarioForm" novalidate>
                            <div class="mb-3 campo">
                                <label for="nombre" class="form-label">Nombre completo</label>
                                <input type="text" class="form-control" id="nombre">
                                <small class="text-danger"></small>
                            </div>
                            <div class="mb-3 campo">
                                <label for="email" class="form-label">Correo electrónico</label>
                                <input type="email" class="form-control" id="email">
                                <small class="text-danger"></small>
                            </div>
                            <div class="mb-3 campo">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="password">
                                <small class="text-danger"></small>
                            </div>
                            <div class="mb-3">
                                <label for="rol" class="form-label">Rol</label>
                                <select class="form-select" id="rol">
                                    <option>Administrador</option>
                                    <option>Técnico</option>
                                    <option selected>Solicitante</option>
                                </select>
                            </div>
                            <div id="mensajeUsuario" class="alert" style="display:none;" role="alert"></div>
                            <button type="submit" class="btn btn-primary w-100">Registrar usuario</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-3">Usuarios del sistema</h5>
                        <div class="table-responsive">
                            <table class="table align-middle mb-0">
                                <thead class="table-light">
                                    <tr><th>#</th><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th></th></tr>
                                </thead>
                                <tbody id="listaUsuarios"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/modulo1.js"></script>
</body>
</html>
