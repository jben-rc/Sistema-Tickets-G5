<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo 2 - Registro de tickets con evidencias</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/modulo2.css">
</head>
<body class="bg-light">

    <div id="menu"></div>

    <div class="container">
        <div class="row g-4">

            <!-- Formulario de nuevo ticket -->
            <div class="col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h5 class="card-title mb-4">Registrar nuevo ticket</h5>

                        <form id="ticketForm" novalidate>
                            <div class="mb-3 campo">
                                <label for="asunto" class="form-label">Asunto</label>
                                <input type="text" class="form-control" id="asunto" maxlength="150">
                                <small class="text-danger"></small>
                            </div>

                            <div class="mb-3 campo">
                                <label for="descripcion" class="form-label">Descripción del incidente</label>
                                <textarea class="form-control" id="descripcion" rows="4"></textarea>
                                <small class="text-danger"></small>
                            </div>

                            <div class="row">
                                <div class="col-sm-6 mb-3">
                                    <label for="categoria" class="form-label">Categoría</label>
                                    <select class="form-select" id="categoria">
                                        <option>Hardware</option>
                                        <option>Software</option>
                                        <option>Red</option>
                                        <option>Impresoras</option>
                                        <option>Correo</option>
                                        <option>Accesos</option>
                                        <option>Otro</option>
                                    </select>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="prioridad" class="form-label">Prioridad</label>
                                    <select class="form-select" id="prioridad">
                                        <option>Alta</option>
                                        <option selected>Media</option>
                                        <option>Baja</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-3 campo">
                                <label for="fotos" class="form-label">Fotos de evidencia (hasta 3)</label>
                                <input type="file" class="form-control" id="fotos" accept="image/*" multiple>
                                <small class="text-danger"></small>
                                <div id="vistaPrevia" class="vista-previa mt-2"></div>
                            </div>

                            <p class="text-muted small">Solicitante: <strong id="solicitante">solicitante@demo.com</strong></p>

                            <div id="mensajeTicket" class="alert" style="display:none;" role="alert"></div>

                            <button type="submit" class="btn btn-primary w-100">Registrar ticket</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Listado de tickets -->
            <div class="col-lg-7">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h5 class="card-title mb-0">Tickets registrados</h5>
                            <button type="button" class="btn btn-outline-danger btn-sm" id="btnLimpiar">Borrar todos</button>
                        </div>

                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Foto</th>
                                        <th>#</th>
                                        <th>Asunto</th>
                                        <th>Prioridad</th>
                                        <th>Estado</th>
                                        <th>Fecha</th>
                                    </tr>
                                </thead>
                                <tbody id="listaTickets"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Detalle del ticket -->
    <div class="modal fade" id="detalleModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detalleTitulo"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted small" id="detalleMeta"></p>
                    <p id="detalleDescripcion" class="descripcion"></p>
                    <h6 class="mt-4">Evidencias fotográficas</h6>
                    <div class="row g-3" id="detalleFotos"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Zoom de la foto -->
    <div id="zoomOverlay" class="zoom-overlay" aria-hidden="true">
        <img id="zoomImagen" src="" alt="Evidencia ampliada">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/modulo2.js"></script>
</body>
</html>
